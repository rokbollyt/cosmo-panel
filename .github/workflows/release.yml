name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build backend binary
        run: |
          cd backend
          cargo build --release --target ${{ matrix.target }}
          cd ..

      - name: Setup Node & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Package Release
        run: |
          mkdir -p release-pkg/frontend
          cp backend/target/${{ matrix.target }}/release/cosmo-panel release-pkg/
          cp -r frontend/dist/* release-pkg/frontend/
          cp install.sh release-pkg/
          tar -czvf cosmo-panel-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C release-pkg .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            cosmo-panel-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            backend/target/${{ matrix.target }}/release/cosmo-panel
